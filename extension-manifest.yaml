id: lociere.napcat-adapter
name: NapCat Adapter
version: 0.2.4
publisher: lociere
license: GPL-3.0-only
repository: https://github.com/lociere/glimmer-cradle-napcat-adapter
homepage: https://github.com/lociere/glimmer-cradle-napcat-adapter
author: lociere
description: Adapter extension for OneBot 11 reverse WebSocket integration, with optional managed NapCat on Desktop Windows
products:
  - desktop
  - personal-server
platforms:
  - windows-x64
  - linux-x64
main: dist/index.js
minAppVersion: 0.2.5
tags:
  - adapter
  - websocket
  - qq
  - onebot11
  - multimodal
requires:
  - perception
  - sceneAttention
  - events
  - commands
  - runtime
  - agents
permissions:
  - PERCEPTION_WRITE
  - EVENT_SUBSCRIBE
  - CONFIG_READ_SELF
  - SECRET_READ_SELF
  - CHAT_SEND
  - COMMAND_REGISTER
  - RUNTIME_PROJECTION_WRITE
  - EXTERNAL_NETWORK
  - AGENT_REGISTER
engines:
  glimmerCradle: 0.2.5
  extensionSdk: 0.2.5

activationProfiles:
  - id: external_onebot
    title: 外部 OneBot
    description: 接受用户或部署层管理的 NapCat / OneBot 11 反向 WebSocket 连接，不管理第三方进程。
    default: true
    requirements:
      products:
        - desktop
        - personal-server
      platforms:
        - windows-x64
        - linux-x64
      features:
        - extensions
    permissions: []
  - id: managed_napcat_windows
    title: Windows 受管 NapCat
    description: 仅供 Desktop Windows 管理 NapCat OneKey、QQ 注入和 WebUI。
    default: false
    requirements:
      products:
        - desktop
      platforms:
        - windows-x64
      features:
        - extensions
    permissions:
      - EXTERNAL_PROCESS

contributes:
  glimmer.command:
    - command: lociere.napcat-adapter.getStatus
      title: 读取状态
      audience: user
      category: NapCat
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
    - command: lociere.napcat-adapter.refreshQrcode
      title: 刷新登录二维码
      audience: user
      category: NapCat
      preconditions:
        - nodeId: webui-management
          requiredState: ready
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - command: lociere.napcat-adapter.quickLogin
      title: 快速登录账号
      audience: user
      category: NapCat
      preconditions:
        - nodeId: webui-management
          requiredState: ready
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - command: lociere.napcat-adapter.setAutoLoginAccount
      title: 设置自动登录账号
      audience: user
      category: NapCat
      preconditions:
        - nodeId: webui-management
          requiredState: ready
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - command: lociere.napcat-adapter.openWebUi
      title: 打开管理面板
      audience: user
      category: NapCat
      preconditions:
        - nodeId: webui-management
          requiredState: ready
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows

  glimmer.capability:
    - id: qq-ingress
      title: QQ 入站感知
      audience: adapter
      description: 将 OneBot 消息清洗后注入微光摇篮感知主线。
      resourceIds:
        - onebot-bridge
      permissions:
        - PERCEPTION_WRITE
      required: true
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
    - id: qq-reply
      title: QQ 受控回复
      audience: adapter
      description: 将角色回复通过 OneBot 发送回对应 QQ 场景。
      resourceIds:
        - onebot-bridge
      permissions:
        - CHAT_SEND
      required: false
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
    - id: napcat-management
      title: NapCat 管理面板
      audience: user
      description: 仅在 Desktop Windows managed NapCat profile 下提供二维码、快速登录和 WebUI 打开。
      resourceIds:
        - webui-management
      permissions:
        - EXTERNAL_NETWORK
      required: false
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows

  glimmer.managementSurface:
    - id: onebot-status-external
      title: OneBot 状态
      audience: user
      kind: status
      resourceIds:
        - external-onebot-source
        - onebot-bridge
      capabilityIds:
        - qq-ingress
        - qq-reply
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
        profiles:
          - external_onebot
    - id: onebot-status-managed
      title: OneBot 与 NapCat 状态
      audience: user
      kind: status
      resourceIds:
        - napcat-managed-process
        - onebot-bridge
        - webui-management
      capabilityIds:
        - qq-ingress
        - qq-reply
        - napcat-management
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - id: napcat-management
      title: NapCat 管理
      audience: user
      kind: management
      resourceIds:
        - napcat-managed-process
        - webui-management
      capabilityIds:
        - napcat-management
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows

  glimmer.setting:
    - key: transport.host
      title: OneBot 监听地址
      description: 同机接入使用回环地址；Compose 私有网络或跨主机接入必须显式选择受保护的监听地址。
      type: string
      default: 127.0.0.1
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
        profiles:
          - external_onebot
    - key: transport.port
      title: OneBot 端口
      description: 反向 WebSocket 监听端口；0 仅允许回环地址时自动选择空闲端口。
      type: number
      default: 0
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
    - key: transport.path
      title: OneBot WebSocket 路径
      description: NapCat 反向 WebSocket 必须连接的精确路径。
      type: string
      default: /
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
    - key: onebot_access_token
      title: OneBot Access Token
      description: write-only Secret；只注入当前 Adapter Host，不进入普通扩展配置、快照或日志。
      type: string
      secret: true
      requiresRestart: true
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
    - key: managed_napcat_windows.launch_mode
      title: 启动模式
      description: official_direct 使用 NapCatWinBootMain.exe；official_shell 显式使用官方 Shell；custom 使用自定义 command。
      type: string
      default: official_direct
      requiresRestart: true
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - key: managed_napcat_windows.qq_path
      title: 专用 QQ 路径
      description: 留空时优先使用 NapCat 包内置 QQ，再回退系统 QQ。建议指向 NapCat 专用 QQ.exe，避免影响日常 QQ。
      type: string
      default: ""
      requiresRestart: true
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - key: managed_napcat_windows.elevation_mode
      title: 启动权限
      description: user 由摇篮直接监督官方启动器；admin 仅在本机确需提权时使用，会变成 detached bootstrap 并等待 probe 闭环。
      type: string
      default: user
      requiresRestart: true
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - key: managed_napcat_windows.allow_preexisting_qq
      title: 允许已运行 QQ
      description: 默认关闭；仅当 NapCat 将要注入的目标 QQ.exe 已运行时才阻止启动。日常使用的其他 QQ 实例不应阻止 NapCat。
      type: boolean
      default: false
      requiresRestart: true
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - key: managed_napcat_windows.preferred_account
      title: 首选账号
      description: 留空表示沿用当前 NapCat 账号。
      type: string
      default: ""
      requiresRestart: true
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - key: ingress.group_enabled
      title: 群聊接入
      description: 允许 OneBot 群聊消息进入受控感知链路。
      type: boolean
      default: true
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
    - key: reply.enabled
      title: 自动回复
      description: 允许角色通过 OneBot 对可回复场景发送消息。
      type: boolean
      default: true
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions

  glimmer.skill:
    - id: qq-source-context
      name: QQ Source Context
      description: 仅在 NapCat / OneBot 来源会话中可见的上下文能力说明。
      audience: character
      scope:
        kind: source_provider
        ids:
          - $self
      policy:
        riskLevel: low
        confirmationRequired: false
        sideEffects: []
        audit: true
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
      tools:
        - name: lociere.napcat-adapter.describe_source_context
          description: 返回当前 QQ / OneBot 来源下可用的回复与上下文约束。
          audience: character
          scope:
            kind: source_provider
            ids:
              - $self
          requirements:
            products:
              - desktop
              - personal-server
            platforms:
              - windows-x64
              - linux-x64
            features:
              - extensions
          parameters:
            type: object
            additionalProperties: false
            properties: {}

  glimmer.managedResource:
    - id: external-onebot-source
      displayName: External OneBot Source
      audience: host
      kind: localService
      required: true
      description: User-managed OneBot / NapCat upstream that reverse-connects into this extension. No third-party binary is bundled into the product.
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
        profiles:
          - external_onebot
    - id: napcat-managed-process
      displayName: NapCat Managed Process
      audience: host
      kind: managedProcess
      required: true
      description: Optional Desktop Windows managed NapCat upstream. The package is stored under data/packages and is not part of the Glimmer Cradle source tree.
      package:
        source:
          type: githubRelease
          repository: NapNeko/NapCatQQ
          assetName: NapCat.Shell.Windows.OneKey.zip
          homepage: https://github.com/NapNeko/NapCatQQ
          license: SEE UPSTREAM LICENSE
        installDir: data/packages/managed-resources/lociere.napcat-adapter/napcat
      process:
        owner: extension
        launchMode: direct
        windowPolicy: hidden
        readinessPolicy: probeRequired
        args: []
      readinessGates:
        - kind: startup
          type: custom
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows
    - id: webui-management
      displayName: NapCat WebUI Management
      audience: user
      kind: managementEndpoint
      required: false
      description: NapCat WebUI management endpoint for QR code, quick login and account management. It is independent from OneBot readiness.
      readinessGates:
        - kind: management
          type: http
          endpoint: http://127.0.0.1:6099/webui
          timeoutMs: 1800
      requirements:
        products:
          - desktop
        platforms:
          - windows-x64
        features:
          - extensions
        profiles:
          - managed_napcat_windows

  glimmer.protocolBridge:
    - id: onebot-bridge
      displayName: OneBot Bridge
      audience: adapter
      kind: protocolBridge
      required: true
      description: OneBot reverse WebSocket bridge into Glimmer Cradle. The bridge is ready only after the upstream connects and get_login_info succeeds.
      readinessGates:
        - kind: readiness
          type: websocket
          timeoutMs: 1800
      requirements:
        products:
          - desktop
          - personal-server
        platforms:
          - windows-x64
          - linux-x64
        features:
          - extensions
